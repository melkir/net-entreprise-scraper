[package]
name = "net-entreprise-scraper"
version = "0.1.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
console_error_panic_hook = "0.1.7"
regex = { version = "1.13.0", default-features = false, features = [
    "std",
    "perf",
    "unicode-case",
    "unicode-gencat",
    "unicode-perl",
] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
